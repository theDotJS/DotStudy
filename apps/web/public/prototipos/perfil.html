<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DotStudy — Perfil (protótipo)</title>

    <!-- Font Awesome local. Nao usar CDN: precisa funcionar sem internet. -->
    <link rel="stylesheet" href="./vendor/fontawesome/css/fontawesome.min.css" />
    <link rel="stylesheet" href="./vendor/fontawesome/css/solid.min.css" />

    <!-- ORDEM IMPORTA: main.css primeiro (base e menu), perfil.css depois (so esta tela). -->
    <link rel="stylesheet" href="./main.css" />
    <link rel="stylesheet" href="./perfil.css" />
  </head>
  <body>
    <button
      class="botao-menu"
      type="button"
      aria-label="Abrir menu"
      aria-expanded="false"
      aria-controls="menu-lateral"
    >
      <i class="fa-solid fa-bars" aria-hidden="true"></i>
    </button>

    <nav class="menu-lateral" id="menu-lateral" aria-label="Menu principal">
      <ul>
        <li>
          <a href="./main.html">
            <i class="fa-solid fa-house" aria-hidden="true"></i>
            Home
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-circle-info" aria-hidden="true"></i>
            Sobre
          </a>
        </li>
        <li>
          <a href="#">
            <i class="fa-solid fa-gears" aria-hidden="true"></i>
            Configurações
          </a>
        </li>
        <li>
          <a href="./perfil.html">
            <i class="fa-solid fa-circle-user" aria-hidden="true"></i>
            Perfil
          </a>
        </li>
        <li>
          <!-- PENDENTE: funcao deste controle nao foi definida. Ver LEIA-ME.md, item 4. -->
          <div class="trilho">
            <div class="indicador"></div>
          </div>
        </li>
      </ul>
    </nav>

    <div class="background"></div>

    <main class="conteudo">
      <form class="container" id="form-perfil">
        <h1>Perfil</h1>

        <div class="foto">
          <img src="./media/userwhite.svg" alt="Foto de perfil de Maria Silva" />
        </div>

        <div class="input-box">
          <label for="nome">Nome</label>
          <input id="nome" name="nome" type="text" autocomplete="given-name" placeholder="Maria" />
        </div>

        <div class="input-box">
          <label for="sobrenome">Sobrenome</label>
          <input
            id="sobrenome"
            name="sobrenome"
            type="text"
            autocomplete="family-name"
            placeholder="Silva"
          />
        </div>

        <div class="input-box">
          <label for="telefone">Telefone</label>
          <input
            id="telefone"
            name="telefone"
            type="tel"
            maxlength="11"
            inputmode="numeric"
            autocomplete="tel-national"
            placeholder="11987654321"
            data-somente-digitos
          />
        </div>

        <div class="input-box">
          <label for="nascimento">Data de nascimento</label>
          <input id="nascimento" name="nascimento" type="date" autocomplete="bday" />
        </div>

        <div class="acoes">
          <button type="reset" class="botao-secundario">Redefinir</button>
          <button type="submit" class="botao-primario">Salvar</button>
        </div>

        <!-- PROTOTIPO: o form ainda nao envia para lugar nenhum.
                 Liga na API quando POST /me existir. Ver docs/contrato-api.md. -->
        <p class="aviso-prototipo" role="status">Protótipo: o botão Salvar ainda não envia nada.</p>
      </form>
    </main>

    <script src="./prototipo.js"></script>
  </body>
</html>
